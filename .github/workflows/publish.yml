name: Publish Package to npmjs

# npmjs 已配置 GitHub Trusted Publisher:
#   - Organization: leo-lab-2026 / Repository: dsh-xgame
#   - Workflow filename: publish.yml(本文件)
#   - Allowed actions: npm publish / npm stage publish
# 本工作流不携带任何 npm token —— 通过 OIDC(id-token: write)自动认证。
#
# OIDC 直接发布的三条硬性要求(踩过的坑,见 dsh-lark-bridge 发布手册):
#   1. 必须跑 Node 24(自带 npm ≥ 11.5.1,OIDC 才生效;Node 22 自带 npm 10 会退回 token 认证并 404)。
#   2. actions/setup-node 不要配置 registry-url —— 无真实 NODE_AUTH_TOKEN 时 setup-node 会
#      写入占位 token,令 OIDC 失效、发布直接 404。
#   3. Trusted Publisher 信任关系需允许 publish 动作(当前已允许 npm publish)。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: '发布方式'
        type: choice
        required: true
        default: 'publish'
        options:
          - publish
          - check

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publisher OIDC 认证必需
    steps:
      - uses: actions/checkout@v6

      # 注意:这里刻意不写 registry-url。一旦写了,setup-node 会写入一个占位 _authToken,
      # npm 便会走 token 认证(而非 OIDC),发布会因凭据错误而 404。
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm ci

      - name: 编译类型与产物
        run: npm run build

      - name: 打包自包含发布产物(dist/index.js)
        run: npm run bundle

      - name: 冒烟测试
        run: npm test

      - name: 校验标签与版本一致(标签触发时)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::标签 v${TAG} 与 package.json 版本 ${PKG} 不一致 —— 先 npm version 再打标签"
            exit 1
          fi

      - name: 直接发布(npm publish,OIDC 全自动,无人工环节)
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: |
          # dist-tag 策略:预发布(beta/rc/pre/dev)进 `next`;`latest` 只收稳定版。
          case "$GITHUB_REF_NAME" in
            *-beta.*|*-rc.*|*-pre.*|*-dev.*) tag="--tag next" ;;
            *) tag="" ;;
          esac
          npm publish --provenance --access public $tag

      - name: 仅检查模式说明
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: echo "check 模式:构建与测试通过,未执行发布。"
